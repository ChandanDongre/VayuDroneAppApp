<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VayuDrone - Book a Drone Service</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
  <link rel="stylesheet" href="dark-mode.css">
  <link rel="stylesheet" href="animations.css">
  <link rel="stylesheet" href="responsive.css">
  <style>
    #map {
      height: 400px;
    }
  </style>
</head>
<body class="fade-in">
  <div class="main-content container">
    <div class="flex items-center bg-[#f9fbf9] p-4 pb-2 justify-between">
      <div class="text-[#121811] flex size-12 shrink-0 items-center" data-icon="ArrowLeft" data-size="24px" data-weight="regular" onclick="window.location.href='home.html'">
        <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
          <path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
        </svg>
      </div>
      <h2 data-translate="Book a Drone Service" class="text-[#121811] text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Book a Drone Service</h2>
    </div>
    <div class="p-4">
      <p class="text-center" data-translate="Mark your farm's boundary on the map below.">Mark your farm's boundary on the map below.</p>
      <div id="map" class="mt-4 rounded-xl border border-[#d8e1d5]"></div>
      <div class="mt-4">
        <p class="text-lg font-bold" data-translate="Farm Area:">Farm Area: <span id="farmArea">0</span> acres</p>
        <p class="text-lg font-bold" data-translate="Estimated Cost:">Estimated Cost: ₹<span id="estimatedCost">0</span></p>
      </div>
      <div class="flex px-4 py-3">
        <button
          class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-12 px-5 flex-1 bg-[#9fd391] text-[#121811] text-base font-bold leading-normal tracking-[0.015em]"
          onclick="confirmBooking()">
          <span data-translate="Confirm Booking" class="truncate">Confirm Booking</span>
        </button>
      </div>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
  <script src="dark-mode.js"></script>
  <script src="translation.js"></script>
  <script>
    const map = L.map('map').setView([28.6139, 77.2090], 13); // Default to Delhi
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    const drawnItems = new L.FeatureGroup();
    map.addLayer(drawnItems);

    const drawControl = new L.Control.Draw({
      edit: {
        featureGroup: drawnItems
      },
      draw: {
        polygon: true,
        polyline: false,
        rectangle: false,
        circle: false,
        marker: false,
        circlemarker: false
      }
    });
    map.addControl(drawControl);

    map.on(L.Draw.Event.CREATED, function (event) {
      const layer = event.layer;
      drawnItems.addLayer(layer);
      const geojson = layer.toGeoJSON();
      const area = turf.area(geojson); // in square meters
      const areaInAcres = area / 4046.86;
      document.getElementById('farmArea').textContent = areaInAcres.toFixed(2);
      document.getElementById('estimatedCost').textContent = (areaInAcres * 250).toFixed(2);
    });

    function confirmBooking() {
      const farmArea = parseFloat(document.getElementById('farmArea').textContent);
      if (farmArea === 0) {
        alert('Please mark your farm on the map.');
        return;
      }

      const bookingDetails = JSON.parse(localStorage.getItem('bookingDetails')) || {};
      const user = JSON.parse(localStorage.getItem('user'));
      const bookings = JSON.parse(localStorage.getItem('bookings')) || [];

      const newBooking = {
        ...bookingDetails,
        area: farmArea,
        cost: farmArea * 250,
        status: 'Pending',
        date: new Date().toISOString(),
        userId: user.mobileNumber,
        agentId: user.isAgent ? user.mobileNumber : null
      };

      bookings.push(newBooking);
      localStorage.setItem('bookings', JSON.stringify(bookings));
      localStorage.removeItem('bookingDetails');
      window.location.href = 'booking-confirmation.html';
    }
  </script>
</body>
</html>

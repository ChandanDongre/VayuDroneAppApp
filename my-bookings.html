<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VayuDrone - My Bookings</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
  <link rel="stylesheet" href="dark-mode.css">
  <link rel="stylesheet" href="animations.css">
  <link rel="stylesheet" href="responsive.css">
</head>
<body class="fade-in">
  <div class="main-content container">
    <div class="flex items-center bg-[#f9fcf8] p-4 pb-2 justify-between">
      <h2 data-translate="My Bookings" class="text-[#111b0e] text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pl-12">My Bookings</h2>
      <div class="flex w-12 items-center justify-end">
        <button
          class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-12 bg-transparent text-[#111b0e] gap-2 text-base font-bold leading-normal tracking-[0.015em] min-w-0 p-0"
          onclick="window.location.href='help-center.html'"
        >
          <div class="text-[#111b0e]" data-icon="Question" data-size="24px" data-weight="regular">
            <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
              <path
                d="M140,180a12,12,0,1,1-12-12A12,12,0,0,1,140,180ZM128,72c-22.06,0-40,16.15-40,36v4a8,8,0,0,0,16,0v-4c0-11,10.77-20,24-20s24,9,24,20-10.77,20-24,20a8,8,0,0,0-8,8v8a8,8,0,0,0,16,0v-.72c18.24-3.35,32-17.9,32-35.28C168,88.15,150.06,72,128,72Zm104,56A104,104,0,1,1,128,24,104.11,104.11,0,0,1,232,128Zm-16,0a88,88,0,1,0-88,88A88.1,88.1,0,0,0,216,128Z"
              ></path>
            </svg>
          </div>
        </button>
      </div>
    </div>
    <div class="flex px-4 py-3">
      <div class="flex h-10 flex-1 items-center justify-center rounded-full bg-[#eaf3e7] p-1">
        <label
          class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-full px-2 has-[:checked]:bg-[#f9fcf8] has-[:checked]:shadow-[0_0_4px_rgba(0,0,0,0.1)] has-[:checked]:text-[#111b0e] text-[#5e974e] text-sm font-medium leading-normal"
        >
          <span data-translate="Pending" class="truncate">Pending</span>
          <input type="radio" name="bookingStatus" class="invisible w-0" value="Pending" checked onchange="filterBookings()" />
        </label>
        <label
          class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-full px-2 has-[:checked]:bg-[#f9fcf8] has-[:checked]:shadow-[0_0_4px_rgba(0,0,0,0.1)] has-[:checked]:text-[#111b0e] text-[#5e974e] text-sm font-medium leading-normal"
        >
          <span data-translate="Confirmed" class="truncate">Confirmed</span>
          <input type="radio" name="bookingStatus" class="invisible w-0" value="Confirmed" onchange="filterBookings()" />
        </label>
        <label
          class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-full px-2 has-[:checked]:bg-[#f9fcf8] has-[:checked]:shadow-[0_0_4px_rgba(0,0,0,0.1)] has-[:checked]:text-[#111b0e] text-[#5e974e] text-sm font-medium leading-normal"
        >
          <span data-translate="In Progress" class="truncate">In Progress</span>
          <input type="radio" name="bookingStatus" class="invisible w-0" value="In Progress" onchange="filterBookings()" />
        </label>
        <label
          class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-full px-2 has-[:checked]:bg-[#f9fcf8] has-[:checked]:shadow-[0_0_4px_rgba(0,0,0,0.1)] has-[:checked]:text-[#111b0e] text-[#5e974e] text-sm font-medium leading-normal"
        >
          <span data-translate="Completed" class="truncate">Completed</span>
          <input type="radio" name="bookingStatus" class="invisible w-0" value="Completed" onchange="filterBookings()" />
        </label>
        <label
          class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-full px-2 has-[:checked]:bg-[#f9fcf8] has-[:checked]:shadow-[0_0_4px_rgba(0,0,0,0.1)] has-[:checked]:text-[#111b0e] text-[#5e974e] text-sm font-medium leading-normal"
        >
          <span data-translate="Cancelled" class="truncate">Cancelled</span>
          <input type="radio" name="bookingStatus" class="invisible w-0" value="Cancelled" onchange="filterBookings()" />
        </label>
      </div>
    </div>
    <div id="bookings-list" class="p-4 space-y-4">
      <!-- Bookings will be dynamically populated here -->
    </div>
  </div>
  <div class="bottom-nav">
    <a href="home.html"><div class="icon">🏠</div><span data-translate="Home">Home</span></a>
    <a href="my-bookings.html" class="active"><div class="icon">📋</div><span data-translate="My Bookings">My Bookings</span></a>
    <a href="profile-overview.html"><div class="icon">👤</div><span data-translate="Profile">Profile</span></a>
    <a href="help-center.html"><div class="icon">❓</div><span data-translate="Help">Help</span></a>
  </div>
  <script src="dark-mode.js"></script>
  <script src="translation.js"></script>
  <script>
    const user = JSON.parse(localStorage.getItem('user'));
    const allBookings = JSON.parse(localStorage.getItem('bookings')) || [];
    const bookingsList = document.getElementById('bookings-list');

    function filterBookings() {
      const status = document.querySelector('input[name="bookingStatus"]:checked').value;
      const filteredBookings = allBookings.filter(booking => {
        const isUserBooking = user.isAgent ? booking.agentId === user.mobileNumber : booking.userId === user.mobileNumber;
        return isUserBooking && booking.status === status;
      });
      renderBookings(filteredBookings);
    }

    function renderBookings(bookings) {
      bookingsList.innerHTML = '';
      if (bookings.length === 0) {
        bookingsList.innerHTML = `<p class="text-center text-gray-500" data-translate="No bookings found.">No bookings found.</p>`;
        return;
      }
      bookings.forEach(booking => {
        const bookingElement = document.createElement('div');
        bookingElement.classList.add('flex', 'items-stretch', 'justify-between', 'gap-4', 'rounded-xl', 'p-4', 'bg-white', 'shadow-md');
        const operatorInfo = booking.operator ? `<p class="text-sm text-gray-500" data-translate="Operator:">Operator: ${booking.operator.name} (${booking.operator.mobile})</p>` : '';
        bookingElement.innerHTML = `
          <div class="flex flex-[2_2_0px] flex-col gap-4">
            <div class="flex flex-col gap-1">
              <p class="text-sm text-gray-500">Booking ID: #${booking.id || (Math.random() * 100000).toFixed(0)}</p>
              <p class="text-base font-bold">${booking.farmerName || 'Self'}</p>
              <p class="text-sm text-gray-500">${new Date(booking.date).toLocaleString()}</p>
              <p class="text-sm text-gray-500" data-translate="Area:">Area: ${booking.area.toFixed(2)} acres</p>
              <p class="text-sm text-gray-500" data-translate="Cost:">Cost: ₹${booking.cost.toFixed(2)}</p>
              ${operatorInfo}
            </div>
            <button
              class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-8 px-4 flex-row-reverse bg-[#eaf3e7] text-[#111b0e] text-sm font-medium leading-normal w-fit"
              onclick="window.location.href='booking-details.html?id=${booking.id}'"
            >
              <span data-translate="View Details" class="truncate">View Details</span>
            </button>
          </div>
          <div
            class="w-full bg-center bg-no-repeat aspect-video bg-cover rounded-xl flex-1"
            style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDDvFGqJnaRJ7Grb--FtiDLGfyGmYADCfzosou2qSbSXxJCZJQ1NPlxn69ANiq3q6eNcpaH8C1LG3tClltx4-LkyXAKAZtkZRi85jGYu5GG1HOMFAOT73bRcNOCjGvDgUKUoMZ020atIspPhDtN_UoS9TwUIAHoVOFDHX_WoZtEKeFZyYL4ycCt9ogP06_TtYWGvySXp8KPH9MxFFwwGUFWKjFkkBO2A_5dFLFFRNhj1mPmKqqOuB2VnH5FN9PMOv9DI4En7CyrRjkm");'
          ></div>
        `;
        bookingsList.appendChild(bookingElement);
      });
    }

    filterBookings();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VayuDrone - Operator Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
  <link rel="stylesheet" href="dark-mode.css">
  <link rel="stylesheet" href="animations.css">
  <link rel="stylesheet" href="responsive.css">
</head>
<body class="fade-in">
  <div class="main-content container text-center">
    <h1 class="text-3xl font-bold mt-8" data-translate="VayuDrone">VayuDrone</h1>
    <p class="mt-2 text-lg" data-translate="Operator Login">Operator Login</p>
    <div class="mt-8">
      <input type="text" id="mobileNumber" class="form-input" placeholder="Mobile Number" data-translate="Mobile Number">
      <button class="w-full mt-4 bg-[#9fd391] text-white py-3 rounded-full text-lg" onclick="sendOtp()" data-translate="Send OTP">Send OTP</button>
      <input type="text" id="otp" class="form-input mt-4" placeholder="Enter OTP" data-translate="Enter OTP">
      <button class="w-full mt-4 bg-[#9fd391] text-white py-3 rounded-full text-lg" onclick="login()" data-translate="Login">Login</button>
    </div>
  </div>
  <script src="dark-mode.js"></script>
  <script src="translation.js"></script>
  <script>
    function sendOtp() {
      const mobileNumber = document.getElementById('mobileNumber').value;
      if (mobileNumber.length !== 10 || !/^\d{10}$/.test(mobileNumber)) {
        alert('Please enter a valid 10-digit mobile number.');
        return;
      }
      // Simulate sending OTP
      alert('OTP sent to ' + mobileNumber);
      localStorage.setItem('operatorOtp', '123456'); // Dummy OTP
    }

    function login() {
      const otp = document.getElementById('otp').value;
      const storedOtp = localStorage.getItem('operatorOtp');
      if (otp.length !== 6 || !/^\d{6}$/.test(otp)) {
        alert('Please enter a valid 6-digit OTP.');
        return;
      }
      if (otp === storedOtp) {
        // In a real application, you would verify the operator's credentials against a database.
        // For this prototype, we'll just create a dummy operator object.
        const operator = {
          mobileNumber: document.getElementById('mobileNumber').value,
          name: 'John Doe' // Dummy name
        };
        localStorage.setItem('operator', JSON.stringify(operator));
        window.location.href = 'operator-dashboard.html';
      } else {
        alert('Invalid OTP.');
      }
    }
  </script>
</body>
</html>

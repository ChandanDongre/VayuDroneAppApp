<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VayuDrone - Admin Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
  <link rel="stylesheet" href="dark-mode.css">
  <link rel="stylesheet" href="animations.css">
  <link rel="stylesheet" href="responsive.css">
</head>
<body class="fade-in">
  <div class="main-content container">
    <div class="flex items-center bg-[#f9fcf8] p-4 pb-2 justify-between">
      <h2 data-translate="Admin Dashboard" class="text-[#111b0e] text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Admin Dashboard</h2>
      <div class="flex w-12 items-center justify-end">
        <button
          class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-12 bg-transparent text-[#111b0e] gap-2 text-base font-bold leading-normal tracking-[0.015em] min-w-0 p-0"
          onclick="logout()"
        >
          <span data-translate="Logout">Logout</span>
        </button>
      </div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 p-4">
      <div class="bg-white rounded-lg shadow-md p-6">
        <h3 class="text-lg font-bold mb-2" data-translate="Total Bookings">Total Bookings</h3>
        <p id="totalBookings" class="text-3xl font-bold">0</p>
      </div>
      <div class="bg-white rounded-lg shadow-md p-6">
        <h3 class="text-lg font-bold mb-2" data-translate="Pending Bookings">Pending Bookings</h3>
        <p id="pendingBookings" class="text-3xl font-bold">0</p>
      </div>
      <div class="bg-white rounded-lg shadow-md p-6">
        <h3 class="text-lg font-bold mb-2" data-translate="Completed Bookings">Completed Bookings</h3>
        <p id="completedBookings" class="text-3xl font-bold">0</p>
      </div>
      <div class="bg-white rounded-lg shadow-md p-6">
        <h3 class="text-lg font-bold mb-2" data-translate="Total Earnings">Total Earnings</h3>
        <p id="totalEarnings" class="text-3xl font-bold">₹0</p>
      </div>
    </div>
    <div class="p-4">
      <a href="admin-booking-management.html" class="block w-full bg-[#9fd391] text-white py-3 rounded-full text-lg text-center" data-translate="Manage Bookings">Manage Bookings</a>
      <a href="admin-user-management.html" class="block w-full bg-[#9fd391] text-white py-3 rounded-full text-lg text-center mt-4" data-translate="Manage Users">Manage Users</a>
      <a href="admin-agent-approval.html" class="block w-full bg-[#9fd391] text-white py-3 rounded-full text-lg text-center mt-4" data-translate="Approve Agents">Approve Agents</a>
    </div>
  </div>
  <script src="dark-mode.js"></script>
  <script src="translation.js"></script>
  <script>
    const admin = JSON.parse(localStorage.getItem('admin'));
    if (!admin) {
      window.location.href = 'admin-login.html';
    }

    const allBookings = JSON.parse(localStorage.getItem('bookings')) || [];
    document.getElementById('totalBookings').textContent = allBookings.length;
    document.getElementById('pendingBookings').textContent = allBookings.filter(b => b.status === 'Pending').length;
    document.getElementById('completedBookings').textContent = allBookings.filter(b => b.status === 'Completed').length;
    document.getElementById('totalEarnings').textContent = `₹${allBookings.filter(b => b.status === 'Completed').reduce((acc, b) => acc + b.cost, 0).toFixed(2)}`;

    function logout() {
      localStorage.removeItem('admin');
      window.location.href = 'admin-login.html';
    }
  </script>
</body>
</html>
